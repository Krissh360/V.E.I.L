<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEIL Demo — KYC & Checkout Verification</title>
  <link rel="stylesheet" href="src/styles/veil-theme.css">
  <style>
    * { box-sizing: border-box; }
    body { align-items: center; background: var(--veil-black); color: var(--veil-ink); display: flex; font-family: var(--veil-sans); justify-content: center; margin: 0; min-height: 100vh; padding: 20px; }
    .card { background: var(--veil-panel); border: 1px solid var(--veil-line); border-radius: 0; max-width: 700px; padding: 32px; width: 550px; }
    h2 { color: var(--veil-gold); font-family: var(--veil-serif); font-weight: 600; margin-top: 0; }
    p { color: var(--veil-ink-dim); font-size: 14px; line-height: 1.5; }
    .field { margin-bottom: 16px; }
    label { color: var(--veil-ink); display: block; font-family: var(--veil-mono); font-size: 12px; margin-bottom: 6px; }
    input { background: var(--veil-black); border: 1px solid var(--veil-line); border-radius: 2px; box-sizing: border-box; color: var(--veil-ink); font-family: var(--veil-mono); font-size: 13px; outline: none; padding: 10px 12px; transition: border-color .15s; width: 100%; }
    input::placeholder { color: var(--veil-ink-dim); }
    input:focus { border-color: var(--veil-gold); }
    button { background: transparent; border: 1px solid var(--veil-gold-dim); border-radius: 2px; color: var(--veil-gold); cursor: pointer; font-family: var(--veil-mono); font-size: 13px; margin-top: 12px; padding: 12px; width: 100%; }
    button:hover, button:focus-visible { border-color: var(--veil-gold); outline: none; }
    .badge { background: transparent; border: 1px solid var(--veil-gold-dim); border-radius: 0; color: var(--veil-gold); display: inline-block; font-family: var(--veil-mono); font-size: 11px; margin-bottom: 12px; padding: 4px 8px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="card" style="display: flex; flex-direction: column; gap: 12px; padding: 32px; width: 100%; border-radius: 15px;">
    <div style="display: flex; align-items: center; justify-content: center;"><span class="badge">VEIL Test Form</span></div>
    <h2 style="text-align: center;">Customer Onboarding / KYC</h2>
    <p style="text-align: center;">Fill out this form or let the VEIL agent autofill while shielding sensitive PII on-device.</p>
    <form id="test-form" onsubmit="event.preventDefault(); alert('Form submitted!');">
      <div class="field"><label for="fullName">Full Name</label><input type="text" id="fullName" name="fullName" placeholder="John Doe" autocomplete="name" /></div>
      <div class="field"><label for="email">Email Address</label><input type="email" id="email" name="email" placeholder="john@example.com" autocomplete="email" /></div>
      <div class="field"><label for="phone">Phone Number</label><input type="tel" id="phone" name="phone" placeholder="+1-555-0199" autocomplete="tel" /></div>
      <div class="field"><label for="aadhaar">Aadhaar / National ID</label><input type="text" id="aadhaar" name="aadhaar" placeholder="1234-5678-9012" /></div>
      <button type="submit" id="submitBtn">Submit Verification</button>
    </form>
  </div>
</body>
</html>
