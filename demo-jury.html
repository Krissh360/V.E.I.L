<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>National Citizen Portal — Identity Verification</title>
  <link rel="stylesheet" href="src/styles/veil-theme.css">
  <style>
    * { box-sizing: border-box; }
    body { align-items: center; background: var(--veil-black); color: var(--veil-ink); display: flex; font-family: var(--veil-sans); justify-content: center; margin: 0; min-height: 100vh; padding: 28px; }
    .portal { background: var(--veil-panel); border: 1px solid var(--veil-line); max-width: 760px; padding: 34px; width: 100%; }
    .eyebrow, label { color: var(--veil-gold); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { color: var(--veil-ink); font: 600 31px/1.1 var(--veil-serif); margin: 8px 0; }
    .intro { color: var(--veil-ink-dim); margin: 0 0 28px; }
    .form-grid { display: grid; gap: 22px; grid-template-columns: 180px 1fr; }
    .photo-wrap { border: 1px solid var(--veil-gold); padding: 7px; position: relative; }
    .photo-wrap::after { color: var(--veil-gold); font-size: 9px; left: 10px; letter-spacing: .08em; position: absolute; top: 10px; }
    .photo-wrap img { display: block; height: 166px; object-fit: cover; width: 100%; }
    .fields { display: grid; gap: 16px; }
    label { display: block; margin-bottom: 7px; }
    input { background: #070605; border: 1px solid var(--veil-line); border-radius: 0; color: var(--veil-ink); font: 15px var(--veil-sans); padding: 12px; width: 100%; }
    button { background: var(--veil-gold); border: 1px solid var(--veil-gold); color: #171208; cursor: pointer; font-weight: 800; letter-spacing: .04em; margin-top: 4px; padding: 13px; width: 100%; }
    .notice { border-top: 1px solid var(--veil-line); color: var(--veil-ink-dim); font-size: 12px; margin-top: 25px; padding-top: 16px; }
    #confirmation { display: none; padding: 58px 10px; text-align: center; }
    #confirmation strong { color: var(--veil-gold); display: block; font: 600 34px var(--veil-serif); margin-bottom: 12px; }
    body.submitted #jury-form { display: none; } body.submitted #confirmation { display: block; }
    @media (max-width: 580px) { .form-grid { grid-template-columns: 1fr; } .photo-wrap { max-width: 180px; } }
  </style>
</head>
<body>
  <main class="portal">
    <div class="eyebrow">National Citizen Portal</div>
    <h1>Identity Verification</h1>
    <p class="intro">Confirm the identity details below to continue your public-service application.</p>
    <form id="jury-form">
      <div class="form-grid">
        <div class="photo-wrap"><img id="identity-photo" src="assets/garou-downhill.png" alt="Face photo for identity verification"></div>
        <div class="fields">
          <div><label for="demo-aadhaar">Aadhaar number</label><input id="demo-aadhaar" name="aadhaar" type="text" inputmode="numeric" placeholder="Enter demo Aadhaar number" required></div>
          <div><label for="demo-password">Portal password</label><input id="demo-password" name="password" type="text" placeholder="Enter portal password" required></div>
        </div>
      </div>
      <button id="jury-submit" type="button">Submit verification</button>
      <p class="notice">Demo data only. No real identity information is used.</p>
    </form>
    <section id="confirmation" aria-live="polite"><strong>Verification submitted</strong><span>Your protected identity verification has been received.</span></section>
  </main>
  <script>
    document.getElementById('jury-submit').addEventListener('click', function () {
      document.body.classList.add('submitted');
    });
  </script>
</body>
</html>
